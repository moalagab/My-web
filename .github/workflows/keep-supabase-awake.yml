name: Keep Supabase awake

# Free Supabase projects pause after a week without database activity, which
# takes the brief form and /admin offline (it happened in November 2026).
# Every three days this runs one read the database must execute; row-level
# security returns an empty list, so no data leaves the database.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Public values, the same ones the site ships to every browser.
      SUPABASE_URL: https://ogrsjrixowkogasgjajb.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_PSfa1bG6UIiZxuNY5KG2Og_Um_3XcCC
    steps:
      - name: Query the database
        run: |
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/leads?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered HTTP $code"
          # Anything but 200 means the project is paused or broken: fail so GitHub emails the owner.
          test "$code" = "200"
