name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public values only (they ship in the browser bundle anyway).
  VITE_SUPABASE_URL: https://ogrsjrixowkogasgjajb.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_PSfa1bG6UIiZxuNY5KG2Og_Um_3XcCC
  VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAFU8KrPJi035AZu7

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: deno test supabase/functions/submit-lead/ src/lib/
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Lighthouse
        run: npx lhci autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report
            lighthouse-report
          retention-days: 14
